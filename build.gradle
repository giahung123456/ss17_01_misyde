plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
    id "org.jetbrains.kotlin.plugin.spring" version '2.3.21'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'ss17_01'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    // Tạo REST Controller demo để test cache
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data Redis (mặc định tích hợp Lettuce)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Bắt buộc có khi cấu hình pool trong lettuce (max-active: 10)
    implementation 'org.apache.commons:commons-pool2'

    // Hỗ trợ serialization JSON cho GenericJackson2JsonRedisSerializer
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

tasks.named('test') {
    useJUnitPlatform()
}
